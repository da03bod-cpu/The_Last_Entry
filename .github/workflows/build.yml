name: build-worker-image
on:
  push:
    branches: [main, "feat/**"]
    paths: ["Dockerfile", "config.py", "ingestion.py", "handler.py", "postprocess.py", "streaming.py", "requirements.txt", "tests/**", ".github/workflows/build.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unit test and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest "runpod>=1.7.0" json-repair pymupdf openpyxl python-docx Pillow pytesseract
      - name: Run Ruff linter
        run: ruff check config.py ingestion.py postprocess.py streaming.py handler.py tests/
      - name: Run unit and golden benchmark tests (CPU / no GPU required)
        run: python -m pytest -v -m "not gpu"

  build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name and version tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v2.1.0
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:${{ github.sha }}
